<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Document title / description (also re-synced per route & language
         at runtime by src/hooks/useSeo.js). Arabic is the default language. -->
    <title>MSA Online | وظائف وفرص مهنية</title>
    <meta
      name="description"
      content="تساعد منصة MSA Online الأشخاص في اكتشاف الفرص الوظيفية وبناء السير الذاتية الاحترافية لمسارهم المهني."
    />
    <!--%CANONICAL%-->

    <!-- Icons: real MSA Online branding (derived from src/assets/images/6.png) -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Browser UI colour, kept in sync with the app theme at runtime -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MSA Online" />
    <meta property="og:title" content="MSA Online | وظائف وفرص مهنية" />
    <meta
      property="og:description"
      content="تساعد منصة MSA Online الأشخاص في اكتشاف الفرص الوظيفية وبناء السير الذاتية الاحترافية لمسارهم المهني."
    />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شعار MSA Online" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MSA Online | وظائف وفرص مهنية" />
    <meta
      name="twitter:description"
      content="تساعد منصة MSA Online الأشخاص في اكتشاف الفرص الوظيفية وبناء السير الذاتية الاحترافية لمسارهم المهني."
    />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.png" />
    <meta name="twitter:image:alt" content="شعار MSA Online" />

    <script>
      // Set the language/direction before first paint so a saved English choice
      // never renders a flash of Arabic RTL. Arabic is the default; the markup
      // above already ships lang="ar" dir="rtl" for first-time visitors.
      (function () {
        try {
          var saved = localStorage.getItem('msa-lang');
          var lang = saved === 'en' || saved === 'ar' ? saved : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          /* storage unavailable — keep the default Arabic RTL markup */
        }
      })();
    </script>

    <script>
      // Set the theme before first paint to avoid a light/dark flash.
      // Priority: saved preference → light. The OS (prefers-color-scheme)
      // preference is deliberately ignored so the site always opens light.
      (function () {
        try {
          var key = 'msa-online-theme';
          var saved = localStorage.getItem(key);
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          // Match browser chrome to the theme chosen before first paint.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#070c18' : '#ffffff');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
